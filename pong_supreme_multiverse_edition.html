        // --- RESET BALL POSITION ---
        function resetBall(direction = 0) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.spin = 0;
            ball.trail = [];
            ball.blackHoleCooling = true; // Prevent center slingshot on spawn

            let dirX = direction === 0 ? (Math.random() > 0.5 ? 1 : -1) : (direction === 1 ? -1 : 1);
            let initialSpeed = currentMode === 'speedball' ? 9.5 : 7.0;

            ball.vx = dirX * initialSpeed;
            ball.vy = (Math.random() - 0.5) * 6;

            // Safe boss spawn override
            if (currentMode === 'boss') {
                ball.x = canvas.width * 0.25;
            }
        }

        // --- AI LOGIC FOR P2 ---
        function updateAI() {
            if (isPvP) {
                if (keys.Up && p2.freezeTimer <= 0) {
                    if (currentMode === 'ice') p2.vyVel = Math.max(p2.vyVel - 2.5, -18);
                    else p2.y -= 14.0;
                }
                if (keys.Down && p2.freezeTimer <= 0) {
                    if (currentMode === 'ice') p2.vyVel = Math.min(p2.vyVel + 2.5, 18);
                    else p2.y += 14.0;
                }
                return;
            }

            if (p2.freezeTimer > 0) return;

            let speed = 5.2;
            let errorMargin = 10;

            if (aiDifficulty === 'easy') { speed = 3.2; errorMargin = 30; }
            else if (aiDifficulty === 'medium') { speed = 5.2; errorMargin = 15; }
            else if (aiDifficulty === 'hard') { speed = 7.2; errorMargin = 5; }
            else if (aiDifficulty === 'impossible') { speed = 10.5; errorMargin = 0; }
            else if (aiDifficulty === 'ultracurve') { speed = 13.0; errorMargin = 2; }
            else if (aiDifficulty === 'adaptive') {
                speed = 5.0 + (scoreP1 - scoreP2) * 0.8;
                speed = Math.max(3, Math.min(11, speed));
            }

            let targetY = ball.y - p2.h / 2;

            // Ultra Curve AI logic: Snaps movement up & down right at impact to maximize spin
            if (aiDifficulty === 'ultracurve' && ball.vx > 0 && Math.abs(ball.x - p2.x) < 250) {
                const curvePhase = Math.sin(performance.now() * 0.035);
                targetY = ball.y - (curvePhase > 0 ? 10 : p2.h - 10);
            }

            // Flashlight Dark Mode AI Vision Limit
            if (currentMode === 'darkmode') {
                const distToAI = Math.hypot(ball.x - (p2.x + p2.w / 2), ball.y - (p2.y + p2.h / 2));
                if (distToAI <= 210) {
                    p2LastKnownBallY = ball.y;
                } else if (p2LastKnownBallY) {
                    targetY = p2LastKnownBallY - p2.h / 2;
                } else {
                    targetY = canvas.height / 2 - p2.h / 2;
                }
            }

            if ((aiDifficulty === 'impossible' || aiDifficulty === 'hard') && ball.vx > 0 && currentMode !== 'darkmode') {
                let timeToReach = (p2.x - ball.x) / ball.vx;
                let predictedY = ball.y + ball.vy * timeToReach;
                while (predictedY < 0 || predictedY > canvas.height) {
                    if (predictedY < 0) predictedY = -predictedY;
                    if (predictedY > canvas.height) predictedY = 2 * canvas.height - predictedY;
                }
                targetY = predictedY - p2.h / 2;
            }

            const centerY = p2.y + p2.h / 2;
            if (Math.abs(centerY - (targetY + p2.h / 2)) > errorMargin) {
                if (currentMode === 'ice') {
                    p2.vyVel += (centerY < targetY + p2.h / 2 ? 1.8 : -1.8);
                    p2.vyVel = Math.max(-18, Math.min(18, p2.vyVel));
                } else {
                    if (centerY < targetY + p2.h / 2) p2.y += speed;
                    else p2.y -= speed;
                }
            }
        }

        // --- INPUT CONTROL HANDLING ---
        window.addEventListener('keydown', (e) => {
            if (['w', 's', 'W', 'S'].includes(e.key)) {
                p1InputMode = 'keys';
            }

            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'ArrowUp') keys.Up = true;
            if (e.key === 'ArrowDown') keys.Down = true;
            if (e.key === 'ArrowLeft') keys.Left = true;
            if (e.key === ' ' || e.key === 'Spacebar') keys.Space = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;

            if (e.key === 'Escape') togglePause();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'ArrowUp') keys.Up = false;
            if (e.key === 'ArrowDown') keys.Down = false;
            if (e.key === 'ArrowLeft') keys.Left = false;
            if (e.key === ' ' || e.key === 'Spacebar') keys.Space = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        window.addEventListener('mousemove', (e) => {
            const distMoved = Math.hypot(e.clientX - lastMousePos.x, e.clientY - lastMousePos.y);
            lastMousePos = { x: e.clientX, y: e.clientY };

            if (distMoved > 3) {
                p1InputMode = 'mouse';
            }

            if (p1InputMode === 'mouse') {
                const rect = canvas.getBoundingClientRect();
                p1.y = e.clientY - rect.top - p1.h / 2;
            }
        });

        // Mobile Touch
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            p1InputMode = 'mouse';
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            p1.y = touch.clientY - rect.top - p1.h / 2;
        }, { passive: false });

        // Flipper Touch Listeners
        const btnFlipL = document.getElementById('btn-flip-left');
        const btnFlipR = document.getElementById('btn-flip-right');
        btnFlipL.addEventListener('touchstart', (e) => { e.preventDefault(); keys.a = true; keys.w = true; });
        btnFlipL.addEventListener('touchend', (e) => { e.preventDefault(); keys.a = false; keys.w = false; });
        btnFlipR.addEventListener('touchstart', (e) => { e.preventDefault(); keys.Left = true; keys.Up = true; });
        btnFlipR.addEventListener('touchend', (e) => { e.preventDefault(); keys.Left = false; keys.Up = false; });

        // --- SPARK PARTICLES CREATION ---
        function spawnSparks(x, y, color, spinMag = 0) {
            const isHighSpin = spinMag > 0.4;
            const sparkCount = isHighSpin ? Math.min(50, 14 + Math.floor(spinMag * 11)) : 12;
            const sparkColors = isHighSpin 
                ? ['#ffffff', '#ffe600', '#ff5500', '#ff0033', '#ff007f'] 
                : [color, '#ffffff'];

            for (let i = 0; i < sparkCount; i++) {
                const speed = isHighSpin ? (4 + Math.random() * (9 + spinMag * 3)) : (2 + Math.random() * 6);
                const angle = Math.random() * Math.PI * 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: sparkColors[Math.floor(Math.random() * sparkColors.length)],
                    alpha: 1.0,
                    size: isHighSpin ? (2 + Math.random() * 3) : (1.5 + Math.random() * 2),
                    decay: 1.6 + Math.random() * 1.4,
                    isSpark: isHighSpin
                });
            }
        }

        function distToSegment(p, v, w) {
            const l2 = (w.x - v.x)**2 + (w.y - v.y)**2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        // --- MAIN GAME UPDATE LOOP ---
        function update(dt) {
            if (isPaused) return;

            audio.init();

            // P1 Keyboard movement (Faster speed: 14.0)
            if (p1InputMode === 'keys' && p1.freezeTimer <= 0) {
                if (currentMode === 'ice') {
                    if (keys.w) p1.vyVel = Math.max(p1.vyVel - 2.5, -18);
                    if (keys.s) p1.vyVel = Math.min(p1.vyVel + 2.5, 18);
                } else {
                    if (keys.w) p1.y -= 14.0;
                    if (keys.s) p1.y += 14.0;
                }
            }

            // Ice Friction Mode Paddle Momentum & Slide
            if (currentMode === 'ice') {
                p1.y += p1.vyVel;
                p2.y += p2.vyVel;
                p1.vyVel *= 0.95;
                p2.vyVel *= 0.95;
            }

            updateAI();

            // Laser Mode Shooting Control
            if (p1LaserCooldown > 0) p1LaserCooldown -= dt;
            if (p2LaserCooldown > 0) p2LaserCooldown -= dt;

            if (currentMode === 'lasers') {
                if (keys.Space && p1LaserCooldown <= 0 && p1.respawnTimer <= 0) {
                    lasers.push({ x: p1.x + p1.w + 10, y: p1.y + p1.h / 2, vx: 14, color: '#00f0ff', owner: 1 });
                    p1LaserCooldown = 0.35;
                    audio.laser();
                }

                // AI / P2 Laser Firing Logic
                if (!isPvP && p2LaserCooldown <= 0 && p2.respawnTimer <= 0) {
                    if (Math.abs((p2.y + p2.h / 2) - (p1.y + p1.h / 2)) < 150 && Math.random() < 0.08) {
                        lasers.push({ x: p2.x - 10, y: p2.y + p2.h / 2, vx: -14, color: '#ff007f', owner: 2 });
                        p2LaserCooldown = 0.5;
                        audio.laser();
                    }
                }
            }

            // Power-ups Mechanics & Active Timers
            if (p1.powerTimer > 0) { p1.powerTimer -= dt; if (p1.powerTimer <= 0) p1.h = 100; }
            if (p2.powerTimer > 0) { p2.powerTimer -= dt; if (p2.powerTimer <= 0) p2.h = 100; }
            if (p1.freezeTimer > 0) p1.freezeTimer -= dt;
            if (p2.freezeTimer > 0) p2.freezeTimer -= dt;

            if (currentMode === 'powerups') {
                powerupSpawnTimer += dt;
                if (powerupSpawnTimer >= 5.0 && powerups.length < 3) {
                    powerupSpawnTimer = 0;
                    const types = [
                        { type: 'grow', icon: '⬆️', color: '#22c55e' },
                        { type: 'shrink', icon: '⬇️', color: '#ef4444' },
                        { type: 'freeze', icon: '❄️', color: '#38bdf8' },
                        { type: 'shield', icon: '🛡️', color: '#f59e0b' },
                        { type: 'speed', icon: '⚡', color: '#eab308' }
                    ];
                    const selected = types[Math.floor(Math.random() * types.length)];
                    powerups.push({
                        x: canvas.width * (0.3 + Math.random() * 0.4),
                        y: canvas.height * (0.2 + Math.random() * 0.6),
                        r: 18,
                        ...selected
                    });
                }
            }

            // Time Warp Zone Update
            if (timeZone) {
                timeZone.x += timeZone.vx;
                timeZone.y += timeZone.vy;
                if (timeZone.x - timeZone.r <= 50 || timeZone.x + timeZone.r >= canvas.width - 50) timeZone.vx = -timeZone.vx;
                if (timeZone.y - timeZone.r <= 20 || timeZone.y + timeZone.r >= canvas.height - 20) timeZone.vy = -timeZone.vy;
            }

            // SHRINKING ARENA BOUNDS
            let topBound = 0;
            let bottomBound = canvas.height;

            if (currentMode === 'shrinking') {
                arenaShrink.top = Math.min(canvas.height * 0.28, arenaShrink.top + dt * 9);
                arenaShrink.bottom = Math.min(canvas.height * 0.28, arenaShrink.bottom + dt * 9);
                topBound = arenaShrink.top;
                bottomBound = canvas.height - arenaShrink.bottom;
            }

            // Clamp Paddles
            p1.y = Math.max(topBound, Math.min(bottomBound - p1.h, p1.y));
            p2.y = Math.max(topBound, Math.min(bottomBound - p2.h, p2.y));

            // Track Paddle Velocity for Spin/Curve
            p1.vy = p1.y - p1.lastY;
            p1.lastY = p1.y;
            p2.vy = p2.y - p2.lastY;
            p2.lastY = p2.y;

            // Respawn Timers for Laser Mode
            if (p1.respawnTimer > 0) {
                p1.respawnTimer -= dt;
                if (p1.respawnTimer <= 0) { p1.hp = 100; p1.respawnTimer = 0; }
            }
            if (p2.respawnTimer > 0) {
                p2.respawnTimer -= dt;
                if (p2.respawnTimer <= 0) { p2.hp = 100; p2.respawnTimer = 0; }
            }

            // Flippers Update
            flippers.forEach(f => {
                let active = false;
                if (f.side === 'left') {
                    if (keys.a || keys.w || keys.Space) active = true;
                } else if (f.side === 'right') {
                    if (isPvP) {
                        if (keys.Left || keys.Up || keys.d) active = true;
                    } else {
                        // AI flipper control: automatically flip when ball approaches
                        const allBalls = [ball, ...extraBalls];
                        for (let b of allBalls) {
                            const distToFlipper = Math.hypot(b.x - f.x, b.y - f.y);
                            if (distToFlipper < 135 && b.x > canvas.width * 0.45) {
                                active = true;
                                break;
                            }
                        }
                    }
                }

                f.isActive = active;
                const targetAngle = active ? f.activeAngle : f.restAngle;
                f.angle += (targetAngle - f.angle) * 0.35;
            });

            // Drones Update
            if (currentMode === 'drones') {
                drones.forEach(d => {
                    d.y += d.vy;
                    if (d.y - d.size/2 <= topBound || d.y + d.size/2 >= bottomBound) {
                        d.vy = -d.vy;
                    }
                    d.shootTimer += dt;
                    if (d.shootTimer >= 2.5) {
                        d.shootTimer = 0;
                        const dir = Math.random() > 0.5 ? 1 : -1;
                        lasers.push({ x: d.x, y: d.y, vx: dir * 7, color: '#ef4444' });
                    }
                });
            }

            // Boss Rotation Update
            if (boss) {
                boss.angle += dt * boss.rotSpeed;
                boss.y = canvas.height / 2 + Math.sin(performance.now() * 0.002) * 30;
            }

            // Bumpers Rotation Update
            bumpers.forEach(bump => {
                bump.angle += dt * bump.rotSpeed;
            });

            // Lasers Update
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.x += l.vx;

                if (l.vx < 0 && p1.respawnTimer <= 0 && l.x <= p1.x + p1.w && l.x >= p1.x && l.y >= p1.y && l.y <= p1.y + p1.h) {
                    p1.hp -= 25;
                    spawnSparks(l.x, l.y, '#00f0ff', 0.5);
                    audio.boom();
                    lasers.splice(i, 1);
                    if (p1.hp <= 0) p1.respawnTimer = 3.0;
                    continue;
                }
                if (l.vx > 0 && p2.respawnTimer <= 0 && l.x >= p2.x && l.x <= p2.x + p2.w && l.y >= p2.y && l.y <= p2.y + p2.h) {
                    p2.hp -= 25;
                    spawnSparks(l.x, l.y, '#ff007f', 0.5);
                    audio.boom();
                    if (l.owner === 1) unlockAchievement('laser_king');
                    lasers.splice(i, 1);
                    if (p2.hp <= 0) p2.respawnTimer = 3.0;
                    continue;
                }

                if (l.x < 0 || l.x > canvas.width) {
                    lasers.splice(i, 1);
                }
            }

            // Quantum Decoys Update
            if (currentMode === 'quantum') {
                if (Math.random() < 0.03 && decoyBalls.length < 5) {
                    decoyBalls.push({
                        x: ball.x + (Math.random() - 0.5) * 40,
                        y: ball.y + (Math.random() - 0.5) * 40,
                        vx: ball.vx + (Math.random() - 0.5) * 2,
                        vy: ball.vy + (Math.random() - 0.5) * 2,
                        alpha: 0.8
                    });
                }
                for (let i = decoyBalls.length - 1; i >= 0; i--) {
                    const db = decoyBalls[i];
                    db.x += db.vx;
                    db.y += db.vy;
                    db.alpha -= dt * 0.4;
                    if (db.alpha <= 0 || db.x < 0 || db.x > canvas.width) {
                        decoyBalls.splice(i, 1);
                    }
                }
            }

            // Update All Active Balls
            const allActiveBalls = [ball, ...extraBalls];
            allActiveBalls.forEach((b) => {
                if (b.scored) return;

                // Ball spin physics & decay (Harder curve in Ice Friction mode)
                const spinCurveForce = currentMode === 'ice' ? 0.08 : 0.04;
                b.vy += (b.spin || 0) * spinCurveForce;
                b.spin = (b.spin || 0) * 0.982;

                if (!b.trail) b.trail = [];
                b.trail.unshift({ x: b.x, y: b.y });
                if (b.trail.length > 12) b.trail.pop();

                // Fixed Time Warp Speed Zone Physics
                if (timeZone) {
                    const distToTZ = Math.hypot(b.x - timeZone.x, b.y - timeZone.y);
                    if (distToTZ < timeZone.r && !b.inTimeZone) {
                        b.inTimeZone = true;
                        const isHyper = Math.random() < 0.35;
                        b.timeWarpFactor = isHyper ? 1.85 : 0.45;
                        b.vx *= b.timeWarpFactor;
                        b.vy *= b.timeWarpFactor;
                        audio.flipper();
                        spawnSparks(b.x, b.y, isHyper ? '#f59e0b' : '#3b82f6', 1.0);
                    } else if (distToTZ >= timeZone.r && b.inTimeZone) {
                        if (b.timeWarpFactor) {
                            b.vx /= b.timeWarpFactor;
                            b.vy /= b.timeWarpFactor;
                        }
                        b.inTimeZone = false;
                        b.timeWarpFactor = 1.0;
                    }
                }

                // Powerups Collision
                for (let pi = powerups.length - 1; pi >= 0; pi--) {
                    const pow = powerups[pi];
                    if (Math.hypot(b.x - pow.x, b.y - pow.y) < pow.r + b.radius) {
                        const beneficiary = b.lastHitBy || (b.vx > 0 ? 1 : 2);
                        const opponent = beneficiary === 1 ? 2 : 1;
                        const benObj = beneficiary === 1 ? p1 : p2;
                        const oppObj = opponent === 1 ? p1 : p2;

                        if (pow.type === 'grow') {
                            benObj.h = 160;
                            benObj.powerTimer = 7.0;
                        } else if (pow.type === 'shrink') {
                            oppObj.h = 55;
                            oppObj.powerTimer = 7.0;
                        } else if (pow.type === 'freeze') {
                            oppObj.freezeTimer = 2.2;
                        } else if (pow.type === 'shield') {
                            if (beneficiary === 1) p1Shield = true;
                            else p2Shield = true;
                        } else if (pow.type === 'speed') {
                            b.vx *= 1.4;
                            b.vy *= 1.4;
                        }

                        audio.bumper();
                        spawnSparks(pow.x, pow.y, pow.color, 1.0);
                        powerups.splice(pi, 1);
                    }
                }

                // Gust Wind Mode
                if (currentMode === 'gust') {
                    windAngle += dt * 0.15;
                    windForce = 0.5 + Math.sin(windAngle * 2) * 0.35;
                    const wx = Math.cos(windAngle) * windForce;
                    const wy = Math.sin(windAngle) * windForce;
                    b.vx += wx * 0.09;
                    b.vy += wy * 0.09;

                    const speedElem = document.getElementById('wind-speed-text');
                    const arrowElem = document.getElementById('wind-arrow-icon');
                    if (speedElem) speedElem.innerText = `${Math.round(windForce * 60)} MPH`;
                    if (arrowElem) arrowElem.style.transform = `rotate(${windAngle * (180/Math.PI) + 90}deg)`;
                }

                // Black Hole Gravity & Center High-Speed Slingshot Launch
                if (currentMode === 'blackhole') {
                    const bhx = canvas.width / 2;
                    const bhy = canvas.height / 2;
                    const dx = bhx - b.x;
                    const dy = bhy - b.y;
                    const distSq = Math.max(dx * dx + dy * dy, 900);
                    const dist = Math.sqrt(distSq);
                    const G = 380;
                    const force = G / distSq;
                    b.vx += (dx / dist) * force;
                    b.vy += (dy / dist) * force;

                    // Super Fast Slingshot Launch when hitting center
                    if (dist < 28 && !b.blackHoleCooling) {
                        b.blackHoleCooling = true;
                        const launchAngle = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 0.4;
                        const launchSpeed = 19.0; // Humanly reactable high speed
                        b.vx = Math.cos(launchAngle) * launchSpeed;
                        b.vy = Math.sin(launchAngle) * launchSpeed;
                        audio.boom();
                        spawnSparks(bhx, bhy, '#a855f7', 1.5);
                    } else if (dist > 95) {
                        b.blackHoleCooling = false;
                    }
                }

                // Move Ball
                b.x += b.vx;
                b.y += b.vy;

                // Wall Bounces
                if (b.y - b.radius <= topBound) {
                    b.y = topBound + b.radius;
                    b.vy = -b.vy;
                    audio.wall();
                } else if (b.y + b.radius >= bottomBound) {
                    b.y = bottomBound - b.radius;
                    b.vy = -b.vy;
                    audio.wall();
                }

                // Goal Shields Collision
                if (p1Shield && b.x - b.radius <= 14) {
                    b.vx = Math.abs(b.vx);
                    p1Shield = false;
                    audio.bumper();
                    spawnSparks(b.x, b.y, '#38bdf8', 1.0);
                }
                if (p2Shield && b.x + b.radius >= canvas.width - 14) {
                    b.vx = -Math.abs(b.vx);
                    p2Shield = false;
                    audio.bumper();
                    spawnSparks(b.x, b.y, '#38bdf8', 1.0);
                }

                // Portals Collision
                portals.forEach(p => {
                    const dist = Math.hypot(b.x - p.x, b.y - p.y);
                    if (dist < p.r + b.radius && !b.portalCooldown) {
                        const other = portals[p.pair];
                        b.x = other.x + Math.sign(b.vx) * (other.r + 10);
                        b.y = other.y;
                        b.portalCooldown = true;
                        setTimeout(() => { b.portalCooldown = false; }, 300);
                        audio.flipper();
                    }
                });

                // Bumpers Collision (Spinning Orange Squares)
                bumpers.forEach(bmp => {
                    const dist = Math.hypot(b.x - bmp.x, b.y - bmp.y);
                    if (dist < (bmp.size / 2) + b.radius) {
                        const angle = Math.atan2(b.y - bmp.y, b.x - bmp.x);
                        const currentSpeed = Math.hypot(b.vx, b.vy);
                        const newSpeed = Math.max(currentSpeed * 1.1, 8);
                        b.vx = Math.cos(angle) * newSpeed;
                        b.vy = Math.sin(angle) * newSpeed;
                        bmp.flash = 10;
                        audio.bumper();
                        spawnSparks(bmp.x, bmp.y, '#f97316', 0.8);
                    }
                    if (bmp.flash > 0) bmp.flash--;
                });

                // Volleyball Net Collision
                if (net) {
                    if (b.x + b.radius >= net.x && b.x - b.radius <= net.x + net.w && b.y + b.radius >= net.y) {
                        b.vx = -b.vx;
                        if (b.x < net.x) b.x = net.x - b.radius;
                        else b.x = net.x + net.w + b.radius;
                        audio.wall();
                    }
                }

                // Bricks Collision
                for (let i = bricks.length - 1; i >= 0; i--) {
                    const br = bricks[i];
                    if (b.x + b.radius >= br.x && b.x - b.radius <= br.x + br.w && b.y + b.radius >= br.y && b.y - b.radius <= br.y + br.h) {
                        b.vx = -b.vx;
                        br.hp--;
                        audio.hit();
                        spawnSparks(b.x, b.y, '#38bdf8', 0.5);
                        if (br.hp <= 0) bricks.splice(i, 1);
                        break;
                    }
                }

                // Hazard Drones Collision
                drones.forEach(d => {
                    if (b.x + b.radius >= d.x - d.size/2 && b.x - b.radius <= d.x + d.size/2 &&
                        b.y + b.radius >= d.y - d.size/2 && b.y - b.radius <= d.y + d.size/2) {
                        b.vx = -b.vx;
                        b.vy = -b.vy;
                        audio.hit();
                        spawnSparks(b.x, b.y, '#ef4444', 0.8);
                    }
                });

                // Centered Boss Collision (Damageable by Both Sides)
                if (boss) {
                    const half = boss.size / 2;
                    if (b.x + b.radius >= boss.x - half && b.x - b.radius <= boss.x + half &&
                        b.y + b.radius >= boss.y - half && b.y - b.radius <= boss.y + half) {
                        
                        b.vx = -b.vx;
                        boss.hp -= 20;
                        audio.hit();
                        spawnSparks(b.x, b.y, '#a855f7', 1.0);

                        const scorer = b.lastHitBy || (b.vx < 0 ? 2 : 1);

                        if (boss.hp <= 0) {
                            boss.hp = boss.maxHp;
                            audio.score();
                            if (scorer === 1) {
                                scoreP1 += 5;
                                document.getElementById('score-p1').innerText = scoreP1;
                                unlockAchievement('boss_slayer');
                            } else {
                                scoreP2 += 5;
                                document.getElementById('score-p2').innerText = scoreP2;
                            }
                        }
                    }
                }

                // Flippers Collision
                flippers.forEach(f => {
                    const tipX = f.x + Math.cos(f.angle) * f.length;
                    const tipY = f.y + Math.sin(f.angle) * f.length;
                    const dist = distToSegment({ x: b.x, y: b.y }, { x: f.x, y: f.y }, { x: tipX, y: tipY });
                    if (dist < b.radius + 10) {
                        const active = f.isActive;
                        const boost = active ? 16 : 10;
                        const angleNormal = f.angle + (f.side === 'left' ? -Math.PI / 2 : Math.PI / 2);
                        
                        b.vx = Math.cos(angleNormal) * boost;
                        b.vy = Math.sin(angleNormal) * boost;
                        b.x += b.vx * 0.5;
                        b.y += b.vy * 0.5;

                        audio.flipper();
                        spawnSparks(b.x, b.y, '#f59e0b', 1.0);
                    }
                });

                // Twin Defense Paddles Definition
                const p1Paddles = [{ x: p1.x, y: p1.y, w: p1.w, h: p1.h }];
                const p2Paddles = [{ x: p2.x, y: p2.y, w: p2.w, h: p2.h }];

                if (currentMode === 'twindefense') {
                    p1Paddles.push({ x: canvas.width * 0.28, y: p1.y, w: p1.w, h: p1.h });
                    p2Paddles.push({ x: canvas.width * 0.72 - p2.w, y: p2.y, w: p2.w, h: p2.h });
                }

                // P1 Paddle Collision
                if (p1.respawnTimer <= 0) {
                    p1Paddles.forEach(pad => {
                        if (b.vx < 0 && b.x - b.radius <= pad.x + pad.w && b.x + b.radius >= pad.x && b.y >= pad.y && b.y <= pad.y + pad.h) {
                            b.x = pad.x + pad.w + b.radius;
                            b.vx = -b.vx * 1.04;
                            const hitOffset = (b.y - (pad.y + pad.h / 2)) / (pad.h / 2);
                            b.vy = hitOffset * 7;
                            b.lastHitBy = 1;
                            
                            // Ice Friction mode amplified spin curve
                            const spinMult = currentMode === 'ice' ? 3.5 : 1.0;
                            b.spin = ((b.spin || 0) + p1.vy * 0.45 + hitOffset * 2.5) * spinMult;
                            const spinMag = Math.abs(b.spin);
                            if (spinMag > 1.8) unlockAchievement('curve_master');

                            if (currentMode === 'speedball') {
                                b.vx *= 1.1;
                                b.vy *= 1.1;
                            }

                            audio.hit();
                            spawnSparks(b.x, b.y, '#00f0ff', spinMag);
                        }
                    });
                }

                // P2 Paddle Collision
                if (p2.respawnTimer <= 0) {
                    p2Paddles.forEach(pad => {
                        if (b.vx > 0 && b.x + b.radius >= pad.x && b.x - b.radius <= pad.x + pad.w && b.y >= pad.y && b.y <= pad.y + pad.h) {
                            b.x = pad.x - b.radius;
                            b.vx = -b.vx * 1.04;
                            const hitOffset = (b.y - (pad.y + pad.h / 2)) / (pad.h / 2);
                            b.vy = hitOffset * 7;
                            b.lastHitBy = 2;

                            // Ice Friction mode amplified spin curve
                            const spinMult = currentMode === 'ice' ? 3.5 : 1.0;
                            b.spin = ((b.spin || 0) + p2.vy * 0.45 + hitOffset * 2.5) * spinMult;
                            const spinMag = Math.abs(b.spin);

                            if (currentMode === 'speedball') {
                                b.vx *= 1.1;
                                b.vy *= 1.1;
                            }

                            audio.hit();
                            spawnSparks(b.x, b.y, '#ff007f', spinMag);
                        }
                    });
                }

                // Goal Scoring Checks
                if (b.x < 0) {
                    scoreP2++;
                    document.getElementById('score-p2').innerText = scoreP2;
                    audio.score();

                    if (currentMode === 'multiball') {
                        // All balls respawn in Multiball mode
                        b.x = canvas.width / 2;
                        b.y = canvas.height / 2;
                        b.vx = (5 + Math.random() * 3);
                        b.vy = (Math.random() - 0.5) * 6;
                        b.spin = 0;
                    } else {
                        b.scored = true;
                        if (b === ball) resetBall(2);
                    }
                } else if (b.x > canvas.width) {
                    scoreP1++;
                    document.getElementById('score-p1').innerText = scoreP1;
                    audio.score();
                    unlockAchievement('first_win');

                    if (currentMode === 'multiball') {
                        // All balls respawn in Multiball mode
                        b.x = canvas.width / 2;
                        b.y = canvas.height / 2;
                        b.vx = -(5 + Math.random() * 3);
                        b.vy = (Math.random() - 0.5) * 6;
                        b.spin = 0;
                    } else {
                        b.scored = true;
                        if (b === ball) resetBall(1);
                    }
                }
            });

            // Clean Scored Extra Balls (Non-multiball modes)
            if (currentMode !== 'multiball') {
                extraBalls = extraBalls.filter(eb => !eb.scored);
            }
            if (ball.scored) ball.scored = false;

            if (currentMode === 'lasers') {
                document.getElementById('hp-bar-p1').style.width = `${Math.max(0, p1.hp)}%`;
                document.getElementById('hp-bar-p2').style.width = `${Math.max(0, p2.hp)}%`;
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.isSpark) {
                    p.vy += 0.14;
                    p.vx *= 0.96;
                }
                p.alpha -= dt * (p.decay || 2.2);
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // --- CANVAS RENDERING SYSTEM ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let primaryGlow = '#00f0ff';
            let secondaryGlow = '#ff007f';
            if (currentTheme === 'synthwave') { primaryGlow = '#f59e0b'; secondaryGlow = '#d946ef'; }
            else if (currentTheme === 'crt') { primaryGlow = '#22c55e'; secondaryGlow = '#16a34a'; }

            // Grid Lines
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Time Warp Zone Visual
            if (timeZone) {
                ctx.save();
                ctx.translate(timeZone.x, timeZone.y);
                const tzGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, timeZone.r);
                tzGrad.addColorStop(0, 'rgba(59, 130, 246, 0.35)');
                tzGrad.addColorStop(0.7, 'rgba(168, 85, 247, 0.2)');
                tzGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = tzGrad;
                ctx.beginPath(); ctx.arc(0, 0, timeZone.r, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([8, 8]);
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(0, 0, timeZone.r, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            // Powerups Visual
            powerups.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.font = '15px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.icon, 0, 1);
                ctx.restore();
            });

            // Goal Shields
            if (p1Shield) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 6;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12, canvas.height); ctx.stroke();
                ctx.shadowBlur = 0;
            }
            if (p2Shield) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 6;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.moveTo(canvas.width - 12, 0); ctx.lineTo(canvas.width - 12, canvas.height); ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Shrinking Arena Borders
            if (currentMode === 'shrinking') {
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.strokeRect(
                    arenaShrink.left,
                    arenaShrink.top,
                    canvas.width - arenaShrink.left - arenaShrink.right,
                    canvas.height - arenaShrink.top - arenaShrink.bottom
                );
                ctx.shadowBlur = 0;
            }

            // Net Line
            if (currentMode !== 'volleyball') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Black Hole Visual
            if (currentMode === 'blackhole') {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 70);
                grad.addColorStop(0, '#000000');
                grad.addColorStop(0.5, '#7e22ce');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.stroke();
            }

            // Bumpers Visual (Spinning Orange Squares)
            bumpers.forEach(bump => {
                ctx.save();
                ctx.translate(bump.x, bump.y);
                ctx.rotate(bump.angle || 0);

                ctx.shadowColor = bump.flash > 0 ? '#ffffff' : '#f97316';
                ctx.shadowBlur = bump.flash > 0 ? 25 : 15;
                ctx.fillStyle = bump.flash > 0 ? '#ffffff' : '#090d16';
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 4;

                const sz = bump.size || 52;
                ctx.fillRect(-sz/2, -sz/2, sz, sz);
                ctx.strokeRect(-sz/2, -sz/2, sz, sz);

                ctx.rotate(-bump.angle || 0);
                ctx.fillStyle = '#f97316';
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(bump.val, 0, 0);

                ctx.restore();
                ctx.shadowBlur = 0;
            });

            // Volleyball Net Visual
            if (net) {
                ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.fillRect(net.x, net.y, net.w, net.h);
                ctx.strokeRect(net.x, net.y, net.w, net.h);
            }

            // Bricks Visual
            bricks.forEach(br => {
                ctx.fillStyle = br.hp === 2 ? '#0284c7' : '#38bdf8';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.fillRect(br.x, br.y, br.w, br.h);
                ctx.strokeRect(br.x, br.y, br.w, br.h);
            });

            // Hazard Drones Visual
            drones.forEach(d => {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 12;
                ctx.fillRect(d.x - d.size/2, d.y - d.size/2, d.size, d.size);
                ctx.strokeRect(d.x - d.size/2, d.y - d.size/2, d.size, d.size);

                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Flippers Visual
            flippers.forEach(f => {
                const tipX = f.x + Math.cos(f.angle) * f.length;
                const tipY = f.y + Math.sin(f.angle) * f.length;
                ctx.strokeStyle = f.side === 'left' ? primaryGlow : secondaryGlow;
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(tipX, tipY); ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Boss Visual (Spinning Centered Entity)
            if (boss) {
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.angle || 0);

                ctx.fillStyle = '#2e1065';
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 20;

                const half = boss.size / 2;
                ctx.fillRect(-half, -half, boss.size, boss.size);
                ctx.strokeRect(-half, -half, boss.size, boss.size);

                ctx.rotate(-boss.angle || 0);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-half, -half - 15, boss.size * (boss.hp / boss.maxHp), 6);

                ctx.restore();
                ctx.shadowBlur = 0;
            }

            // Portals Visual
            portals.forEach(p => {
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 4;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Flashlight Dark Mode Spotlight
            if (currentMode === 'darkmode') {
                ctx.save();
                ctx.fillStyle = 'rgba(2, 4, 10, 0.98)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = 'destination-out';

                const lightSources = [
                    { x: p1.x + p1.w / 2, y: p1.y + p1.h / 2, radius: 180 },
                    { x: p2.x + p2.w / 2, y: p2.y + p2.h / 2, radius: 180 }
                ];

                lightSources.forEach(src => {
                    const grad = ctx.createRadialGradient(src.x, src.y, 10, src.x, src.y, src.radius);
                    grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
                    grad.addColorStop(0.6, 'rgba(0, 0, 0, 0.7)');
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(src.x, src.y, src.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }

            // Draw Paddles
            const p1Paddles = [{ x: p1.x, y: p1.y }];
            if (currentMode === 'twindefense') p1Paddles.push({ x: canvas.width * 0.28, y: p1.y });

            p1Paddles.forEach(pad => {
                ctx.save();
                if (p1.respawnTimer > 0) ctx.globalAlpha = 0.3;
                if (p1.freezeTimer > 0) ctx.fillStyle = '#38bdf8';
                else ctx.fillStyle = primaryGlow;
                ctx.shadowColor = primaryGlow;
                ctx.shadowBlur = 15;
                ctx.fillRect(pad.x, pad.y, p1.w, p1.h);
                ctx.restore();
            });

            const p2Paddles = [{ x: p2.x, y: p2.y }];
            if (currentMode === 'twindefense') p2Paddles.push({ x: canvas.width * 0.72 - p2.w, y: p2.y });

            p2Paddles.forEach(pad => {
                ctx.save();
                if (p2.respawnTimer > 0) ctx.globalAlpha = 0.3;
                if (p2.freezeTimer > 0) ctx.fillStyle = '#38bdf8';
                else ctx.fillStyle = secondaryGlow;
                ctx.shadowColor = secondaryGlow;
                ctx.shadowBlur = 15;
                ctx.fillRect(pad.x, pad.y, p2.w, p2.h);
                ctx.restore();
            });

            // Quantum Decoys
            decoyBalls.forEach(db => {
                ctx.save();
                ctx.globalAlpha = db.alpha;
                ctx.fillStyle = '#a855f7';
                ctx.beginPath(); ctx.arc(db.x, db.y, 8, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            // Balls & Motion Trails with Spin Hot-Red Glow Effect
            const allBalls = [ball, ...extraBalls];
            allBalls.forEach(b => {
                const spinMag = Math.abs(b.spin || 0);
                const hasSpin = spinMag > 0.4;
                const ballColor = hasSpin ? '#ff0033' : (b.color || primaryGlow);
                const ballGlow = hasSpin ? '#ff0055' : (b.color || primaryGlow);

                // Flashlight Mode Opacity Clamped to 10%
                const modeAlpha = currentMode === 'darkmode' ? 0.10 : 1.0;

                for (let i = 0; i < (b.trail ? b.trail.length : 0); i++) {
                    const pt = b.trail[i];
                    const alpha = (1 - i / b.trail.length) * 0.5 * modeAlpha;
                    ctx.fillStyle = ballColor;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, b.radius * (1 - i / (b.trail.length * 1.5)), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = modeAlpha;

                ctx.fillStyle = ballColor;
                ctx.shadowColor = ballGlow;
                ctx.shadowBlur = hasSpin ? Math.min(38, 16 + spinMag * 6) : 15;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;
            });

            // Lasers Visual
            lasers.forEach(l => {
                ctx.fillStyle = l.color;
                ctx.shadowColor = l.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(l.x - 10, l.y - 3, 20, 6);
                ctx.shadowBlur = 0;
            });

            // Gust Breeze Particles
            if (currentMode === 'gust') {
                ctx.strokeStyle = 'rgba(45, 212, 191, 0.25)';
                ctx.lineWidth = 1.5;
                windParticles.forEach(wp => {
                    wp.x += Math.cos(windAngle) * wp.speed;
                    wp.y += Math.sin(windAngle) * wp.speed;
                    if (wp.x < 0) wp.x = canvas.width;
                    if (wp.x > canvas.width) wp.x = 0;
                    if (wp.y < 0) wp.y = canvas.height;
                    if (wp.y > canvas.height) wp.y = 0;

                    ctx.beginPath();
                    ctx.moveTo(wp.x, wp.y);
                    ctx.lineTo(wp.x + Math.cos(windAngle) * wp.len, wp.y + Math.sin(windAngle) * wp.len);
                    ctx.stroke();
                });
            }

            // Spark Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                const pSize = p.size || 3;
                ctx.fillRect(p.x, p.y, pSize, pSize);
                ctx.restore();
            });
        }

        // --- MAIN LOOP RUNNER ---
        let lastTime = performance.now();
        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        // --- UI & MODAL INTERACTION LOGIC ---
        function togglePause() {
            isPaused = !isPaused;
            const pauseModal = document.getElementById('modal-pause');
            if (isPaused) {
                populatePauseModeSelect();
                pauseModal.classList.remove('hidden');
            } else {
                pauseModal.classList.add('hidden');
            }
        }

        function populatePauseModeSelect() {
            const select = document.getElementById('pause-mode-select');
            select.innerHTML = '';
            GAME_MODES.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = `${m.icon} ${m.name}`;
                if (m.id === currentMode) opt.selected = true;
                select.appendChild(opt);
            });
        }

        document.getElementById('pause-mode-select').addEventListener('change', (e) => {
            initMode(e.target.value);
        });

        function populateModeGrid() {
            const grid = document.getElementById('modes-grid');
            grid.innerHTML = '';
            GAME_MODES.forEach(m => {
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl glass-panel border transition cursor-pointer flex flex-col justify-between hover:scale-[1.02] ${currentMode === m.id ? 'border-cyan-400 bg-cyan-950/30' : 'border-slate-800 hover:border-cyan-500/50'}`;
                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-3 mb-2">
                            <span class="text-2xl">${m.icon}</span>
                            <h3 class="font-bold font-orbitron text-cyan-300 text-sm">${m.name}</h3>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed">${m.desc}</p>
                    </div>
                    <button class="mt-4 w-full py-2 rounded-xl text-xs font-bold font-orbitron uppercase tracking-wider ${currentMode === m.id ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-cyan-500/20 hover:text-cyan-300'} transition">
                        ${currentMode === m.id ? 'ACTIVE MODE' : 'SELECT MODE'}
                    </button>
                `;
                card.addEventListener('click', () => {
                    initMode(m.id);
                    document.getElementById('modal-modes').classList.add('hidden');
                    populateModeGrid();
                });
                grid.appendChild(card);
            });
        }

        // UI Event Listeners
        document.getElementById('btn-modes').addEventListener('click', () => {
            populateModeGrid();
            document.getElementById('modal-modes').classList.remove('hidden');
        });
        document.getElementById('btn-close-modes').addEventListener('click', () => {
            document.getElementById('modal-modes').classList.add('hidden');
        });
        document.getElementById('btn-pause').addEventListener('click', togglePause);
        document.getElementById('btn-resume').addEventListener('click', togglePause);
        document.getElementById('btn-pause-modes').addEventListener('click', () => {
            togglePause();
            populateModeGrid();
            document.getElementById('modal-modes').classList.remove('hidden');
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            scoreP1 = 0; scoreP2 = 0;
            document.getElementById('score-p1').innerText = '0';
            document.getElementById('score-p2').innerText = '0';
            initMode(currentMode);
            togglePause();
        });

        // PvP / AI Mode Toggle
        const btnPvp = document.getElementById('btn-toggle-pvp');
        btnPvp.addEventListener('click', () => {
            isPvP = !isPvP;
            btnPvp.innerText = isPvP ? '2P LOCAL MATCH' : '1P VS AI';
            btnPvp.className = `px-4 py-2 rounded-xl text-xs font-bold transition ${isPvP ? 'bg-pink-500 text-white border border-pink-400' : 'bg-cyan-500 text-slate-950 border border-cyan-400'}`;
            document.getElementById('p2-label').innerText = isPvP ? 'Player 2 (P2)' : 'Player 2 (AI)';
            document.getElementById('ai-diff-container').style.display = isPvP ? 'none' : 'flex';
            document.getElementById('mode-subtitle-display').innerText = isPvP ? '2 PLAYER LOCAL' : `1P VS AI (${aiDifficulty.toUpperCase()})`;
        });

        // AI Difficulty Selection
        document.querySelectorAll('.ai-diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.ai-diff-btn').forEach(b => {
                    b.className = 'ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300';
                });
                aiDifficulty = e.target.dataset.diff;
                e.target.className = 'ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-slate-950 font-bold';
                document.getElementById('mode-subtitle-display').innerText = `1P VS AI (${aiDifficulty.toUpperCase()})`;
            });
        });

        // Sound Toggle
        document.getElementById('btn-sound').addEventListener('click', () => {
            audio.muted = !audio.muted;
            document.getElementById('icon-sound-on').classList.toggle('hidden', audio.muted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !audio.muted);
        });

        // Theme Toggle
        document.getElementById('btn-theme').addEventListener('click', () => {
            const themes = ['cyberpunk', 'synthwave', 'crt'];
            const idx = (themes.indexOf(currentTheme) + 1) % themes.length;
            currentTheme = themes[idx];
        });

        // Achievements Modal
        document.getElementById('btn-achievements').addEventListener('click', () => {
            const list = document.getElementById('achievements-list');
            list.innerHTML = '';
            ACHIEVEMENTS.forEach(a => {
                const item = document.createElement('div');
                item.className = 'p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex justify-between items-center';
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-xs text-amber-400 font-orbitron">${a.title}</div>
                        <div class="text-xs text-slate-400">${a.desc}</div>
                    </div>
                    <span class="text-xs font-bold px-2 py-1 rounded-lg ${a.unlocked ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-500'}">
                        ${a.unlocked ? 'UNLOCKED' : 'LOCKED'}
                    </span>
                `;
                list.appendChild(item);
            });
            document.getElementById('modal-achievements').classList.remove('hidden');
        });
        document.getElementById('btn-close-achievements').addEventListener('click', () => {
            document.getElementById('modal-achievements').classList.add('hidden');
        });

        // --- START ENGINE ---
        loadAchievements();
        populateModeGrid();
        initMode('classic');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
