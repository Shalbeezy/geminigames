<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONG SUPREME: Multiverse Edition</title>
    <!-- Tailwind CSS for modern responsive UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            color: #f0f4f8;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Custom glowing scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 3px;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 10px 35px 0 rgba(0, 0, 0, 0.75);
        }

        /* Neon text & border glows */
        .glow-cyan {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
        }
        .glow-magenta {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }
        .glow-gold {
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.8), 0 0 20px rgba(245, 158, 11, 0.4);
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden bg-slate-950 text-white select-none">

    <!-- TOP HUD OVERLAY -->
    <header class="absolute top-0 left-0 w-full z-10 px-6 py-3 flex justify-between items-center bg-gradient-to-b from-slate-950/90 via-slate-950/50 to-transparent pointer-events-none">
        <!-- Player 1 Status -->
        <div class="flex items-center space-x-4 pointer-events-auto">
            <div class="flex flex-col">
                <span class="text-xs uppercase tracking-widest text-cyan-400 font-bold">Player 1 (P1)</span>
                <span id="score-p1" class="text-4xl font-black font-orbitron text-cyan-400 glow-cyan">0</span>
                <!-- Laser Mode Health Bar P1 -->
                <div id="hp-container-p1" class="hidden w-32 h-3 bg-slate-800 rounded-full overflow-hidden border border-cyan-500/50 mt-1">
                    <div id="hp-bar-p1" class="h-full bg-gradient-to-r from-cyan-500 to-blue-400 w-full transition-all duration-150"></div>
                </div>
            </div>
        </div>

        <!-- Mode Title & Dynamic Gauge HUD -->
        <div class="flex flex-col items-center justify-center text-center">
            <h1 id="mode-title-display" class="text-lg md:text-2xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 uppercase glow-cyan">
                CLASSIC PONG
            </h1>
            <span id="mode-subtitle-display" class="text-xs text-slate-400 font-mono tracking-wide">
                1P VS AI (MEDIUM)
            </span>
            <!-- Wind Gauge HUD for Gust Mode -->
            <div id="wind-hud" class="hidden items-center space-x-2 mt-1 px-3 py-1 bg-slate-900/90 rounded-full border border-teal-500/40 text-xs font-mono text-teal-300">
                <span>WIND GAUGE:</span>
                <span id="wind-speed-text" class="font-bold">0 MPH</span>
                <svg id="wind-arrow-icon" class="w-4 h-4 transform transition-transform duration-200 text-teal-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </div>
        </div>

        <!-- Player 2 / AI Status -->
        <div class="flex items-center space-x-4 pointer-events-auto">
            <div class="flex flex-col items-end">
                <span id="p2-label" class="text-xs uppercase tracking-widest text-pink-400 font-bold">Player 2 (AI)</span>
                <span id="score-p2" class="text-4xl font-black font-orbitron text-pink-500 glow-magenta">0</span>
                <!-- Laser Mode Health Bar P2 -->
                <div id="hp-container-p2" class="hidden w-32 h-3 bg-slate-800 rounded-full overflow-hidden border border-pink-500/50 mt-1">
                    <div id="hp-bar-p2" class="h-full bg-gradient-to-r from-pink-500 to-rose-400 w-full transition-all duration-150"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- FLOATING ACTION BUTTONS (TOP RIGHT CORNER) -->
    <div class="absolute top-4 right-4 z-20 flex space-x-2">
        <button id="btn-sound" class="p-2.5 rounded-xl glass-panel hover:bg-cyan-500/20 text-cyan-400 transition border border-cyan-500/30" title="Toggle Sound">
            <svg id="icon-sound-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <svg id="icon-sound-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
        </button>
        <button id="btn-theme" class="p-2.5 rounded-xl glass-panel hover:bg-purple-500/20 text-purple-400 transition border border-purple-500/30" title="Change Visual Theme">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
        </button>
        <button id="btn-achievements" class="p-2.5 rounded-xl glass-panel hover:bg-amber-500/20 text-amber-400 transition border border-amber-500/30" title="Achievements">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
        </button>
        <button id="btn-pause" class="p-2.5 rounded-xl glass-panel hover:bg-cyan-500/20 text-cyan-400 transition border border-cyan-500/30" title="Pause Game">

        </button>
        <button id="btn-modes" class="px-4 py-2 rounded-xl glass-panel hover:bg-cyan-500/20 text-cyan-300 font-bold text-sm transition border border-cyan-500/40 flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span>MODES</span>
        </button>
    </div>

    <!-- MAIN GAME CANVAS -->
    <main class="relative flex-grow w-full h-full">
        <canvas id="gameCanvas" class="w-full h-full bg-slate-950"></canvas>
    </main>

    <!-- ON-SCREEN MOBILE / TOUCH FLIPPER BUTTONS (Pinball Mode Only) -->
    <div id="flipper-controls" class="hidden absolute bottom-6 left-0 right-0 z-20 justify-between px-8 pointer-events-none">
        <button id="btn-flip-left" class="pointer-events-auto px-8 py-4 bg-cyan-600/80 active:bg-cyan-400 text-white font-orbitron font-bold rounded-2xl border-2 border-cyan-300 shadow-lg shadow-cyan-500/40 touch-none">FLIP LEFT (A / W / SPACE)</button>
        <button id="btn-flip-right" class="pointer-events-auto px-8 py-4 bg-pink-600/80 active:bg-pink-400 text-white font-orbitron font-bold rounded-2xl border-2 border-pink-300 shadow-lg shadow-pink-500/40 touch-none">FLIP RIGHT (LEFT ARROW / UP / D)</button>
    </div>

    <!-- MODE SELECTION MODAL / DASHBOARD -->
    <div id="modal-modes" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md transition-opacity duration-300">
        <div class="glass-panel w-full max-w-5xl max-h-[92vh] rounded-3xl p-6 md:p-8 flex flex-col overflow-hidden border border-cyan-500/40">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl md:text-3xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 glow-cyan">
                        MULTIVERSE EDITION: MODE SELECT
                    </h2>
                    <p class="text-xs md:text-sm text-slate-400">Select one of 21 hyper-customized game modes</p>
                </div>
                <button id="btn-close-modes" class="p-2 text-slate-400 hover:text-white rounded-full hover:bg-slate-800 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Match Settings Bar (1P/2P, AI Difficulty) -->
            <div class="flex flex-wrap items-center justify-between gap-4 p-4 mb-6 bg-slate-900/90 rounded-2xl border border-slate-800">
                <div class="flex items-center space-x-3">
                    <span class="text-xs uppercase font-bold text-slate-400">Match Type:</span>
                    <button id="btn-toggle-pvp" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-cyan-500 text-slate-950 border border-cyan-400">1P VS AI</button>
                </div>
                <div id="ai-diff-container" class="flex flex-wrap items-center gap-2">
                    <span class="text-xs uppercase font-bold text-slate-400">AI Difficulty:</span>
                    <button class="ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300" data-diff="easy">EASY</button>
                    <button class="ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-slate-950 font-bold" data-diff="medium">MEDIUM</button>
                    <button class="ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300" data-diff="hard">HARD</button>
                    <button class="ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 text-pink-400 border border-pink-500/40" data-diff="impossible">PREDICTIVE</button>
                    <button class="ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 text-amber-400 border border-amber-500/40" data-diff="adaptive">ADAPTIVE</button>
                    <button class="ai-diff-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 text-purple-400 border border-purple-500/40" data-diff="ultracurve">ULTRA CURVE</button>
                </div>
            </div>

            <!-- Modes Grid -->
            <div id="modes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2 pb-4">
                <!-- Dynamically Populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- PAUSE MODAL -->
    <div id="modal-pause" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 text-center space-y-6 border border-cyan-500/40">
            <h2 class="text-3xl font-black font-orbitron text-cyan-400 glow-cyan">GAME PAUSED</h2>
            
            <div class="space-y-3">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Switch Mode Mid-Match:</label>
                <select id="pause-mode-select" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 border border-cyan-500/40 text-cyan-300 font-bold text-sm focus:outline-none">
                    <!-- Populated via JS -->
                </select>
            </div>

            <div class="flex flex-col space-y-3 pt-2">
                <button id="btn-resume" class="w-full py-3 rounded-xl bg-cyan-500 text-slate-950 font-bold font-orbitron hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/30">
                    RESUME MATCH
                </button>
                <button id="btn-restart" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold font-orbitron transition border border-slate-700">
                    RESET SCORES & BALL
                </button>
                <button id="btn-pause-modes" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-purple-300 font-bold font-orbitron transition border border-purple-500/40">
                    FULL MODE MENU
                </button>
            </div>
        </div>
    </div>

    <!-- ACHIEVEMENTS MODAL -->
    <div id="modal-achievements" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 border border-amber-500/40">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold font-orbitron text-amber-400 glow-gold">ACHIEVEMENTS</h2>
                <button id="btn-close-achievements" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="achievements-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- ACHIEVEMENT NOTIFICATION TOAST -->
    <div id="achievement-toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none glass-panel p-4 rounded-2xl border border-amber-500/50 flex items-center space-x-3 shadow-lg shadow-amber-500/20">
        <div class="text-3xl">🏆</div>
        <div>
            <div class="text-[10px] uppercase font-bold text-amber-400 tracking-wider font-orbitron">Achievement Unlocked!</div>
            <div id="toast-title" class="font-bold text-sm text-white font-orbitron">Title</div>
            <div id="toast-desc" class="text-xs text-slate-300">Description</div>
        </div>
    </div>

    <!-- SOUND SYNTHESIS & GAME ENGINE SCRIPT -->
    <script>
        // --- WEB AUDIO API SYNTHESIZER ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, vol = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            wall() { this.playTone(220, 'sine', 0.08, 0.08); }
            hit() { this.playTone(440, 'triangle', 0.1, 0.12); }
            score() {
                if (this.muted || !this.ctx) return;
                this.playTone(523.25, 'square', 0.12, 0.15);
                setTimeout(() => this.playTone(659.25, 'square', 0.12, 0.15), 100);
                setTimeout(() => this.playTone(783.99, 'square', 0.25, 0.15), 200);
            }
            laser() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            flipper() { this.playTone(330, 'sine', 0.06, 0.1); }
            bumper() { this.playTone(600, 'sine', 0.12, 0.15); }
            boom() {
                if (this.muted || !this.ctx) return;
                this.playTone(90, 'sawtooth', 0.3, 0.25);
            }
            achievement() {
                if (this.muted || !this.ctx) return;
                this.playTone(523.25, 'triangle', 0.1, 0.15);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.15), 80);
                setTimeout(() => this.playTone(783.99, 'triangle', 0.1, 0.15), 160);
                setTimeout(() => this.playTone(1046.50, 'square', 0.25, 0.2), 240);
            }
        }

        const audio = new SoundEngine();

        // --- GAME MODES DEFINITIONS (21 Google Snake Style Modes) ---
        const GAME_MODES = [
            { id: 'classic', name: 'Classic Pong', icon: '🏓', desc: 'Standard retro Pong physics with precision spin curve physics.' },
            { id: 'multiball', name: 'Multiball Chaos', icon: '🔮', desc: 'Multiple hyper-fast balls bouncing continuously around the court. All balls respawn!' },
            { id: 'portals', name: 'Warp Portals', icon: '🌀', desc: 'Teleportation portals redirect ball trajectories unexpectedly.' },
            { id: 'bumpers', name: 'Bumper Grid', icon: '🟧', desc: 'Spinning orange square pinball bumpers propel balls with bonus momentum.' },
            { id: 'powerups', name: 'Power-Up Mayhem', icon: '⭐', desc: 'Collect floating icons for Paddle Grow, Shrink, Shields, and Freeze Beams.' },
            { id: 'speedball', name: 'Speedball Hyper', icon: '⚡', desc: 'Ball speed accelerates by 1.1x on every hit with hot ember spark FX.' },
            { id: 'darkmode', name: 'Flashlight Dark', icon: '🔦', desc: 'Pitch-black court illuminated by paddle searchlights with 10% ball visibility.' },
            { id: 'blackhole', name: 'Black Hole', icon: '🕳️', desc: 'Center gravitational singularity launching balls super fast on center contact.' },
            { id: 'twindefense', name: 'Twin Defense', icon: '🛡️', desc: 'Dual mirrored paddles defend each player zone simultaneously.' },
            { id: 'boss', name: 'Boss Raid', icon: '👾', desc: 'A giant spinning central boss entity that both players can hit to score bonus points.' },
            { id: 'lasers', name: 'Laser Cannons', icon: '🔫', desc: 'Press SPACE to shoot laser bolts! 100 HP health bars with 3s respawns.' },
            { id: 'quantum', name: 'Quantum Ghost', icon: '👻', desc: 'Ball spawns ghost decoys in superposition to confuse opponents.' },
            { id: 'shrinking', name: 'Shrinking Arena', icon: '📐', desc: 'Physical upper and lower borders steadily narrow down the playing field.' },
            { id: 'gust', name: 'Gust Wind', icon: '💨', desc: 'Dynamic swirling wind physics vector indicated in real-time on top HUD.' },
            { id: 'pinball', name: 'Pinball Flipper', icon: '🎯', desc: 'Interactive pinball flippers propels the ball across the board.' },
            { id: 'volleyball', name: 'Volleyball Net', icon: '🏐', desc: 'A central physical net blocks low returns, requiring high arcing lob shots.' },
            { id: 'drones', name: 'Hazard Drones', icon: '🛸', desc: 'Hostile moving defense drones shoot lasers and bounce balls in midfield.' },
            { id: 'ice', name: 'Ice Friction', icon: '🧊', desc: 'Zero-friction slippery ice paddle movement with maximum spin curve physics!' },
            { id: 'bricks', name: 'Brick Defense', icon: '🧱', desc: 'Breakout brick wall barriers protecting player goal lines.' },
            { id: 'timewarp', name: 'Time Warp', icon: '⏳', desc: 'Bouncing speed dilation zone dynamically applies slow-mo or hyper-warp effects.' },
            { id: 'sandbox', name: 'Custom Sandbox', icon: '🛠️', desc: 'Fully customizable arena parameters.' }
        ];

        // --- ACHIEVEMENTS DATA ---
        const ACHIEVEMENTS = [
            { id: 'first_win', title: 'First Blood', desc: 'Score your first point in any mode.', unlocked: false },
            { id: 'curve_master', title: 'Spin Wizard', desc: 'Impart a massive curve spin on the ball.', unlocked: false },
            { id: 'boss_slayer', title: 'Raid Leader', desc: 'Defeat the central spinning boss in Boss Raid mode.', unlocked: false },
            { id: 'laser_king', title: 'Sniper', desc: 'Land a laser shot on your opponent.', unlocked: false }
        ];

        // --- ACHIEVEMENTS SYSTEM LOGIC ---
        function loadAchievements() {
            try {
                const saved = localStorage.getItem('pong_supreme_achievements');
                if (saved) {
                    const unlockedIds = JSON.parse(saved);
                    ACHIEVEMENTS.forEach(a => {
                        if (unlockedIds.includes(a.id)) a.unlocked = true;
                    });
                }
            } catch(e) {}
        }

        function saveAchievements() {
            try {
                const unlockedIds = ACHIEVEMENTS.filter(a => a.unlocked).map(a => a.id);
                localStorage.setItem('pong_supreme_achievements', JSON.stringify(unlockedIds));
            } catch(e) {}
        }

        function unlockAchievement(id) {
            const ach = ACHIEVEMENTS.find(a => a.id === id);
            if (!ach || ach.unlocked) return;

            ach.unlocked = true;
            saveAchievements();
            audio.achievement();

            const toast = document.getElementById('achievement-toast');
            const toastTitle = document.getElementById('toast-title');
            const toastDesc = document.getElementById('toast-desc');

            if (toast && toastTitle && toastDesc) {
                toastTitle.innerText = ach.title;
                toastDesc.innerText = ach.desc;
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3500);
            }
        }

        // --- STATE VARIABLES ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentMode = 'classic';
        let currentTheme = 'cyberpunk';
        let isPvP = false;
        let aiDifficulty = 'medium';
        let isPaused = false;

        let p1InputMode = 'mouse'; // 'mouse' or 'keys'

        // --- RESIZE & CANVAS SETUP ---
        function resizeCanvas() {

            lasers = [];
            bricks = [];

            flippers = [];

            particles = [];

            p1.hp = 100; p1.respawnTimer = 0; p1.freezeTimer = 0; p1.h = 100; p1.vyVel = 0;

        // --- MODE INITIALIZER ---
        function initMode(modeId) {

                    { x: canvas.width * 0.3, y: canvas.height * 0.7, r: 24, pair: 3, color: '#f59e0b' },
                    { x: canvas.width * 0.7, y: canvas.height * 0.3, r: 24, pair: 2, color: '#10b981' }
                ];
            } else if (modeId === 'bumpers') {
                bumpers = [
                    { x: canvas.width * 0.4, y: canvas.height * 0.3, size: 50, val: 100, rotSpeed: 1.5, angle: 0, flash: 0 },
                    { x: canvas.width * 0.6, y: canvas.height * 0.3, size: 50, val: 100, rotSpeed: -1.5, angle: 0, flash: 0 },
                    { x: canvas.width * 0.4, y: canvas.height * 0.7, size: 50, val: 100, rotSpeed: -1.5, angle: 0, flash: 0 },
                    { x: canvas.width * 0.6, y: canvas.height * 0.7, size: 50, val: 100, rotSpeed: 1.5, angle: 0, flash: 0 },
                    { x: canvas.width * 0.5, y: canvas.height * 0.5, size: 60, val: 250, rotSpeed: 2.0, angle: 0, flash: 0 }

            } else if (modeId === 'gust') {
                document.getElementById('wind-hud').classList.remove('hidden');
                document.getElementById('wind-hud').classList.add('flex');
                for (let i = 0; i < 40; i++) {
                    windParticles.push({

                document.getElementById('flipper-controls').classList.remove('hidden');
                document.getElementById('flipper-controls').classList.add('flex');
                
                flippers = [
                    { x: canvas.width * 0.32, y: canvas.height * 0.35, length: 110, angle: Math.PI / 4, restAngle: Math.PI / 4, activeAngle: -Math.PI / 6, side: 'left' },
                    { x: canvas.width * 0.32, y: canvas.height * 0.65, length: 110, angle: -Math.PI / 4, restAngle: -Math.PI / 4, activeAngle: Math.PI / 6, side: 'left' },
                    { x: canvas.width * 0.68, y: canvas.height * 0.35, length: 110, angle: (3 * Math.PI) / 4, restAngle: (3 * Math.PI) / 4, activeAngle: (7 * Math.PI) / 6, side: 'right' },
                    { x: canvas.width * 0.68, y: canvas.height * 0.65, length: 110, angle: -(3 * Math.PI) / 4, restAngle: -(3 * Math.PI) / 4, activeAngle: -(7 * Math.PI) / 6, side: 'right' }

                drones = [
                    { x: canvas.width * 0.4, y: canvas.height * 0.25, size: 36, vy: 3, shootTimer: 0 },
                    { x: canvas.width * 0.6, y: canvas.height * 0.75, size: 36, vy: -3, shootTimer: 1.2 }
                ];
            } else if (modeId === 'bricks') {
                const brickCols = 2;
                const brickRows = 6;
                const bWidth = 16;
                const bHeight = canvas.height / (brickRows + 2);

                for (let r = 0; r < brickRows; r++) {
                    bricks.push({ x: canvas.width * 0.22, y: (r + 1) * bHeight, w: bWidth, h: bHeight - 6, hp: 2 });
                    bricks.push({ x: canvas.width * 0.78 - bWidth, y: (r + 1) * bHeight, w: bWidth, h: bHeight - 6, hp: 2 });
                }
            } else if (modeId === 'timewarp') {
                timeZone = {
                    x: canvas.width / 2,
